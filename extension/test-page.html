        继续量化交易教学，讲清楚为什么小盘股因子可能不是 alpha，而是风险补偿。
      </div>
    </article>
    <article>
      <div data-message-author-role="assistant">
        <p>你选 B，方向是对的。更严谨的答案是：B 是第一怀疑对象，但最终要按 D 处理。</p>
        <p>小盘股看起来更容易出超额收益，原因可能是信息少、机构覆盖少、流动性差、波动大、容量小。</p>
        <p>所以判断一个小盘有效因子，不能只看收益，要按市值分组、看 Rank IC、做市值中性化，并检查坏环境下是否大亏。</p>
        <p>这说明所有小盘因子都不能用，最好不要碰小盘股。</p>
      </div>
