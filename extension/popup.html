<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI Response Feedback Lab</title>
    <style>
      body {
        width: 300px;
        margin: 0;
        padding: 14px;
        color: #15181c;
        background: #f7f8f5;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      }

      h1 {
        margin: 0;
        font-size: 17px;
        line-height: 1.25;
      }

      p {
        margin: 8px 0 0;
        color: #5b6470;
        font-size: 13px;
        line-height: 1.45;
      }

      .box {
        margin-top: 12px;
        padding: 10px;
        border: 1px solid #d5dce5;
        border-radius: 8px;
        background: #fff;
      }

      a {
        color: #1f5f8f;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <h1>AI Response Feedback Lab</h1>
    <p>在 ChatGPT、Claude、Gemini、Copilot 页面里给 AI 回答逐段标记。</p>
    <div class="box">
      <p>用法：打开 AI 对话页面，点击回答下方的“标记回答”，或选中文本后点右下角“RF 标记”。</p>
    </div>
    <p><a href="https://github.com/walterkken/ai-response-feedback-lab" target="_blank">打开项目仓库</a></p>
  </body>
</html>
